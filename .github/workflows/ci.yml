name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      # 每个脚本都要能通过语法检查，别等 update 跑起来才炸
      - name: Syntax check
        run: for f in tools/*.mjs; do node --check "$f"; done

      # 上游畸形百分号转义曾把 Parse 整轮打断，这里守住
      - name: Parse regression test
        run: node tools/test-parse.mjs

      # 用 fixture 跑一遍 export，确保产物生成链路没断
      - name: Export smoke test
        run: node tools/test-export.mjs
