name: pages

on:
  # 手动推送时 update（tools/** 变动）也会触发，由它提交产物后经
  # workflow_run 接力部署最新内容；直接 push 触发的部署只会拿到旧
  # artifact，与 update 竞争时必失败，故不设 push 触发器
  workflow_run:
    workflows: [update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # 轮询产物注册状态
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # update 跑挂了就别把半成品推上线
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 只发布站点文件，别把 .git / tools / data 一起传上去
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r qr sub clients _site/
          cp -r assets _site/
          cp README.md _site/

      # enablement: Pages 还没启用时自动建站（首次发布必走这条），
      # 省掉手动去 Settings → Pages 选 Source 的步骤
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # upload 刚结束就 deploy，产物可能还没注册完：deploy-pages 查一次
      # 拿到 "Found 0 artifact(s)" 就整步失败（曾把一次部署打挂）。先轮询等它出现。
      - name: Wait for artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                  --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            if [ "$n" -ge 1 ]; then
              echo "github-pages artifact 已就绪（第 ${i} 次查询）"
              exit 0
            fi
            sleep 2
          done
          echo "等待 github-pages artifact 超时（60s）" >&2
          exit 1

      - id: dep
        uses: actions/deploy-pages@v4
