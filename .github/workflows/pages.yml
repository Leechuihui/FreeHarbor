name: pages

on:
  # 手动推送时 update（tools/** 变动）也会触发，由它提交产物后经
  # workflow_run 接力部署最新内容；直接 push 触发的部署只会拿到旧
  # artifact，与 update 竞争时必失败，故不设 push 触发器
  workflow_run:
    workflows: [update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # 轮询产物注册状态
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # update 跑挂了就别把半成品推上线
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep1.outputs.page_url || steps.dep2.outputs.page_url || steps.dep3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # 只发布站点文件，别把 .git / tools / data 一起传上去
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r qr sub clients _site/
          cp -r assets _site/
          cp README.md _site/

      # enablement: Pages 还没启用时自动建站（首次发布必走这条），
      # 省掉手动去 Settings → Pages 选 Source 的步骤
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # upload 结束到产物「可被部署」之间存在注册延迟。
      # 关键点：不能用 `gh api .../artifacts` 去等。那是公开 REST 接口，
      # 而 deploy-pages 走的是 runtime token 的内部 Twirp 接口
      # (ArtifactService/ListArtifacts)。两套注册表不同步，REST 已能查到
      # 产物时 Twirp 仍可能返回 0 —— 等待步瞬间通过、下一步在同一秒内
      # 拿到 "No artifacts named github-pages" 整步失败（run 34/32/30 均如此）。
      # 所以直接重试 deploy-pages 本身：只有它真正命中才叫就绪。
      - id: dep1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Backoff before retry 1
        if: steps.dep1.outcome == 'failure'
        run: sleep 10

      - id: dep2
        if: steps.dep1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Backoff before retry 2
        if: steps.dep1.outcome == 'failure' && steps.dep2.outcome == 'failure'
        run: sleep 30

      - id: dep3
        if: steps.dep1.outcome == 'failure' && steps.dep2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # 三次全挂才让 job 失败，避免竞态把一次好构建打成红的
      - name: Assert deployment
        if: steps.dep1.outcome != 'success' && steps.dep2.outcome != 'success' && steps.dep3.outcome != 'success'
        run: |
          echo "deploy-pages 连续 3 次失败，最后一次日志见上方。" >&2
          exit 1
