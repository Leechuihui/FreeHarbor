name: pages

on:
  push:
    branches: [main]
  # 机器人用 GITHUB_TOKEN 推送不会触发 push，靠 workflow_run 接力
  workflow_run:
    workflows: [update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # update 跑挂了就别把半成品推上线
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 只发布站点文件，别把 .git / tools / data 一起传上去
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r qr sub clients _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
