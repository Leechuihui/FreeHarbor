name: update

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  # 只在工具链/工作流本身变动时跑；机器人提交的产物不触发，避免自激
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # runner 用户写不了 /usr/local/bin，装到工作区再指过去
      - name: Install xray
        run: |
          # 下到 RUNNER_TEMP，别落在工作树里被 git add -A 一起提交
          curl -fsSL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o "$RUNNER_TEMP/xray.zip"
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -o "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/xray"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/xray" version

      - run: npm ci --no-audit --no-fund

      - name: Fetch
        run: node tools/fetch.mjs
        continue-on-error: true

      - name: Parse
        run: node tools/parse.mjs

      - name: Probe
        run: node tools/probe.mjs --limit=1800

      # 先删旧结果：xray 装不上时不能让上一轮的陈旧数据冒充本轮验证
      # 验证失败不拖垮整轮；没验证结果时 export 会自动退回 checked.json
      # 不限条数全量验，覆盖率不再被名额卡死
      - name: Verify egress
        run: rm -f data/verified.json && VERIFY_CONCURRENCY=32 node tools/verify.mjs
        continue-on-error: true

      - name: Export
        run: node tools/export.mjs

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m "chore: refresh nodes $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 明确推 main，schedule 触发的 detached HEAD 也不会推错
          git push origin HEAD:main
